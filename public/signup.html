<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | User Management API</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/common.js" defer></script>
    <script src="/js/signup.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <a class="brand" href="/">User Management API</a>
        <button class="menu-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          Menu
        </button>
        <div class="nav-links" id="site-nav"></div>
      </nav>
    </header>

    <main class="container narrow-container page-section">
      <section class="page-intro">
        <span class="eyebrow">Join the project</span>
        <h1>Create your account</h1>
        <p>New accounts are reviewed by an admin before they can log in.</p>
      </section>

      <section class="card form-card">
        <div class="alert alert-success" id="signup-success" role="status" aria-live="polite" hidden></div>
        <div class="alert alert-error" id="signup-error" role="alert" hidden></div>
        <p class="notice notice-info" id="approval-note" hidden>
          Your account is pending admin approval. You can log in after it is approved.
        </p>

        <form class="form" id="signup-form" novalidate>
          <div class="form-group">
            <label for="signup-name">Full name</label>
            <input id="signup-name" name="name" type="text" autocomplete="name" required minlength="3">
          </div>

          <div class="form-group">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" required minlength="6">
          </div>

          <div class="form-group">
            <label for="signup-confirm-password">Confirm password</label>
            <input id="signup-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required>
          </div>

          <label class="checkbox-row" for="show-passwords">
            <input id="show-passwords" type="checkbox">
            <span>Show passwords</span>
          </label>

          <div class="form-group">
            <label for="signup-role">Account type</label>
            <select id="signup-role" name="role" required>
              <option value="user" selected>User</option>
              <option value="admin">Admin</option>
            </select>
            <small class="field-help">Admin accounts also require approval.</small>
          </div>

          <button class="button button-primary button-full" id="signup-submit" type="submit">
            Create Account
          </button>
        </form>

        <p class="form-footnote">Already have an account? <a href="/login.html">Log in</a></p>
      </section>
    </main>
  </body>
</html>
