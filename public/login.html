<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | User Management API</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/common.js" defer></script>
    <script src="/js/login.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <a class="brand" href="/">User Management API</a>
        <button class="menu-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          Menu
        </button>
        <div class="nav-links" id="site-nav"></div>
      </nav>
    </header>

    <main class="container narrow-container page-section">
      <section class="page-intro">
        <span class="eyebrow">Welcome back</span>
        <h1>Log in to your account</h1>
        <p>Use your approved account to access your dashboard.</p>
      </section>

      <section class="card form-card">
        <div class="alert alert-success" id="login-success" role="status" aria-live="polite" hidden></div>
        <div class="alert alert-error" id="login-error" role="alert" aria-live="polite" hidden></div>

        <form class="form" id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <label class="checkbox-row" for="show-login-password">
            <input id="show-login-password" type="checkbox">
            <span>Show password</span>
          </label>

          <button class="button button-primary button-full" id="login-submit" type="submit">
            Login
          </button>
        </form>

        <p class="form-footnote">Don't have an account? <a href="/signup.html">Create one</a></p>
      </section>
    </main>
  </body>
</html>
